[package]
name = "cf-nitrogen"
description = "The other hydrogen an acre needs — nitrogen fertilizer as ammonia, from USDA NASS application rates and stoichiometry, on the same farm and the same window as the fuel"
keywords = ["hydrogen", "ammonia", "agriculture", "fertilizer"]
categories = ["science", "simulation"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.cortenforge]
tier = "L0"

[dependencies]
# The `Demand` seam stage 3 published. Nitrogen is a second draw on the same
# hydrogen, not a new stage shape.
cf-storage = { path = "../cf-storage" }
# The window. NASS reports anhydrous application and fall tillage in the SAME
# sentence and the same week, so the operable-days shape stage 4 measured is
# the shape this draw has too — reused rather than re-derived.
cf-tillage = { path = "../cf-tillage" }

[dev-dependencies]
# Stages 1 and 2, to run the finished demand against the real wind year and say
# how many acres one farm's own hydrogen can fertilize.
cf-wind = { path = "../cf-wind" }
cf-electrolysis = { path = "../cf-electrolysis" }
# So NASS_TSV_SHA256 is a measurement rather than a number nothing produces.
sha2 = "0.11"

[lints]
workspace = true
