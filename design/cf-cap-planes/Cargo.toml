[package]
name = "cortenforge-cap-planes"
description = "Cap-plane parsing for cleaned scans: reads a .prep.toml [caps] block and strips cap-polygon faces from the scan, so consumers can build cap-stripped (dome-wall-only) signed-distance fields"
keywords = ["geometry", "mesh", "sdf", "3d", "scan"]
categories = ["graphics", "mathematics"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.cortenforge]
tier = "L0"

[lib]
name = "cf_cap_planes"

[lints]
workspace = true

[dependencies]
# `IndexedMesh` (input to `dome_wall_only_mesh` + the diagnostic).
mesh-types = { workspace = true }
# `Point3` + `Vector3` for the post-bake `CapPlane` runtime type.
nalgebra = { workspace = true }
# `.prep.toml` parser for the `[caps]` + `[transform]` blocks.
serde = { workspace = true }
toml = { workspace = true }
# `Result` + `Context` for the parser's error reporting.
anyhow = { workspace = true }
