# CortenForge Rust Formatting Configuration
#
# This ensures consistent formatting across the entire codebase.
# Run: cargo fmt --all
#
# See: https://rust-lang.github.io/rustfmt/
#
# Stable options only. The toolchain is pinned to a stable release
# (rust-toolchain.toml), and rustfmt on stable ignores a nightly-only option,
# printing a warning for each file it formats. Until 2026-11-02 this file set six
# such options (imports_granularity, group_imports, format_code_in_doc_comments,
# format_strings, trailing_comma, trailing_semicolon); none applied. The import
# rule imports_granularity = "Module" encoded is a review rule now: docs/STANDARDS.md,
# "Style Base".

edition = "2021"
max_width = 100
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"

# Import organization
reorder_imports = true
reorder_modules = true

# Formatting
hard_tabs = false
use_field_init_shorthand = true
use_try_shorthand = true
