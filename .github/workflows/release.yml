# CortenForge Release Workflow
#
# Triggered on version tags (v*.*.*)
# Creates GitHub releases with:
# - SBOM (Software Bill of Materials)
# - Auto-generated changelog from conventional commits
#
# ⚠ No binaries are attached. Cendrillon was shipped here as a 4-target
# download until 2026-09-02; it is now run from source (`cargo run -p
# cf-studio-gui`), so the build/package/sign job and the app archives are gone.
# Restoring a download means restoring THREE things deleted with it, not one:
#   1. site/cendrillon/index.html's download buttons (they 404 without this job)
#   2. site/style.css's `.downloads` / `.button*` / `details.firstrun` rules —
#      without them those buttons render as bare unstyled links
#   3. tools/cf-studio-gui/macos/Info.plist — the "Package Studio (macOS .app)"
#      step sed-substituted __VERSION__ from it; packaging fails without it
# All three went in the same commit, so `git show` on it is the restore list.
#
# See docs/INFRASTRUCTURE.md for the full constraint specification.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # Pre-releases like v0.8.0-rc.1

permissions:
  contents: write
  # ⚠ `id-token: write` was dropped 2026-09-02. It was granted "for SLSA
  # provenance", but no step ever minted or consumed an OIDC token, and the
  # only artifact signing that existed (ad-hoc `codesign` on the macOS .app)
  # went with the retired download. Re-add it in the same change that actually
  # generates provenance, not before — it is an elevated identity grant.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # GENERATE SBOM
  # ============================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    # `release` now gates on this job, and `cargo install cargo-cyclonedx` is
    # an unpinned from-source build — a crates.io stall would otherwise sit at
    # GitHub's 360-minute default and produce NO release at all, changelog
    # included. 20 matches the sibling SBOM job in quality-gate.yml.
    timeout-minutes: 20
    # ⚠ RE-DERIVED 2026-09-02, and the verdict FLIPPED. This job was
    # `continue-on-error: true` because it was "supplementary — must never
    # block the actual downloads": it deferred to a more important payload.
    # That payload is gone, and the SBOM is now the release's ONLY attached
    # asset. Left non-blocking, a broken `cargo install cargo-cyclonedx`
    # would publish a release with zero files while the body claims an SBOM,
    # and nothing would go red. A payload job blocks.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      # Current cargo-cyclonedx has no --output-file; it writes a
      # <crate>.cdx.json per package. Generate, then gather them.
      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --format json

      # cargo-cyclonedx writes one <crate>.cdx.json per workspace member
      # (~280 of them). Keep only Cendrillon's — attaching all of them as
      # release assets is noise AND trips GitHub's upload rate limit. ⚠ It is
      # no longer "the shipped app": nothing is shipped. It is kept as the
      # representative subgraph, and the release body says so rather than
      # implying workspace coverage.
      # ⚠ The four strict points below all hang on this exact filename, and
      # `cargo install cargo-cyclonedx` above is UNPINNED — a tool release that
      # renamed the output (say `cf-studio-gui_bin.cdx.json`) would match
      # nothing and block the release entirely. That is the right failure
      # direction (loud and re-runnable beats an empty release that looks
      # fine), but it must NAME ITS CAUSE rather than surfacing as a confusing
      # upload error, because nothing pre-merge exercises this filename:
      # quality-gate's own sbom job globs `*.cdx.json` and is deliberately
      # non-blocking.
      - name: Collect Studio SBOM
        run: |
          mkdir -p sbom-out
          find . -name 'cf-studio-gui.cdx.json' -not -path './sbom-out/*' -exec cp {} sbom-out/ \;
          if [ ! -f sbom-out/cf-studio-gui.cdx.json ]; then
            echo "::error::No cf-studio-gui.cdx.json was produced. It is the" \
                 "release's only asset, so this blocks the release. Check" \
                 "whether cargo-cyclonedx changed its output name or layout" \
                 "— these are the .cdx.json files it did write:"
            find . -name '*.cdx.json' -not -path './sbom-out/*' | head -20
            exit 1
          elif [ ! -s sbom-out/cf-studio-gui.cdx.json ]; then
            echo "::error::cf-studio-gui.cdx.json is EMPTY (0 bytes). The file" \
                 "is where it should be, so this is a truncated or failed" \
                 "write, not a rename — check runner disk space."
            exit 1
          fi

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-out/
          # `error`, not `warn`: if the find above matched nothing the job has
          # produced no asset at all, and the release it feeds would publish
          # empty. This was `warn` while binaries were the payload.
          if-no-files-found: error

  # ============================================================================
  # GENERATE CHANGELOG
  # ============================================================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Nearest version tag that is an ANCESTOR of this one (git describe
          # walks ancestry, so a tag on a squash-merged side branch — not in
          # this commit's history — is correctly skipped). `--match 'v[0-9]*'`
          # keeps any non-version tag from being picked as the baseline.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # No ancestor tag (genuine first release, or earlier tags live on
            # squash-merged branches outside this history). Do NOT fall back to
            # `git log HEAD` — that dumps the entire repo history into the notes.
            # A short note is the honest, readable result.
            COMMITS="- Initial tagged release from this history."
          else
            # Commits since the previous ancestor tag.
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi

          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep "^- feat" || true)
          FIXES=$(echo "$COMMITS" | grep "^- fix" || true)
          DOCS=$(echo "$COMMITS" | grep "^- docs" || true)
          REFACTORS=$(echo "$COMMITS" | grep "^- refactor" || true)
          OTHER=$(echo "$COMMITS" | grep -v "^- feat\|^- fix\|^- docs\|^- refactor" || true)

          # Build changelog. Category headers are h3 (###) so they nest under
          # the release body's "## What's new" h2 instead of colliding with it.
          CHANGELOG=""

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### Features\n\n${FEATURES}\n\n"
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes\n\n${FIXES}\n\n"
          fi

          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}### Documentation\n\n${DOCS}\n\n"
          fi

          if [ -n "$REFACTORS" ]; then
            CHANGELOG="${CHANGELOG}### Refactoring\n\n${REFACTORS}\n\n"
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes\n\n${OTHER}\n\n"
          fi

          # Output for GitHub Actions
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ============================================================================
  # CREATE RELEASE
  # ============================================================================
  release:
    name: Create Release
    needs: [sbom, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `continue-on-error` here, and none on the `sbom` job either: with
      # the app archives retired the SBOM is the only asset, so a missing one
      # is an empty release, not a degraded one. FOUR points used to tolerate
      # that and all four are now strict — this step, the `sbom` job, its
      # `if-no-files-found`, and `fail_on_unmatched_files` below. Relaxing any
      # one of them restores the silent-empty-release path.
      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: sbom
          path: ./artifacts

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: CortenForge ${{ steps.version.outputs.version }}
          body: |
            # CortenForge ${{ steps.version.outputs.version }}

            The CortenForge SDK — a Rust workspace for mechatronics design and
            simulation, and **Cendrillon**, the guided app that takes a 3D scan
            all the way to printable, silicone-cast molds.

            ## Running it

            There is no download. Everything here is built from source:

            ```
            git clone https://github.com/via-balaena/CortenForge
            cd CortenForge
            cargo run -p cf-studio-gui      # Cendrillon
            ```

            You need a Rust toolchain (see `rust-toolchain.toml`), **CMake and
            a C++ compiler** for the vendored mold-CSG kernel, and a working
            Vulkan or GL driver for the 3D views. On Debian/Ubuntu also install
            `libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev
            libfontconfig1-dev` — the same packages CI installs; without the
            last one the build fails inside `yeslogic-fontconfig-sys`.

            Building from source also removes the unsigned-binary warnings the
            old downloads carried on macOS and Windows.

            ## What's new

            ${{ needs.changelog.outputs.changelog }}

            ---
            By using this software you accept the terms in `DISCLAIMER.md` — it is general-purpose research software, provided **as is**, **not a medical device**, used **entirely at your own risk**. The repository carries `LICENSE-APACHE`, `LICENSE-MIT`, `NOTICE`, and `DISCLAIMER.md`.

            A CycloneDX SBOM for `cf-studio-gui` is attached — Cendrillon's own resolved dependency graph, not the whole workspace, whose ~280 per-crate SBOMs would trip GitHub's upload limit. Read the file itself for what it contains; it is machine-readable and authoritative, and any prose summary here would be a second copy to drift. The workspace meets the A-grade quality standard ([STANDARDS.md](https://github.com/via-balaena/CortenForge/blob/main/docs/STANDARDS.md)).
          files: |
            artifacts/*.cdx.json
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # PUBLISH TO CRATES.IO (Optional - manual trigger)
  # ============================================================================
