# CortenForge Release Workflow
#
# Triggered on version tags (v*.*.*)
# Creates GitHub releases with:
# - SBOM (Software Bill of Materials)
# - Auto-generated changelog from conventional commits
#
# ⚠ No binaries attached; the Cendrillon download was retired 2026-09-02.
# ⚠ Restoring it is not a one-line change: it needs the 4-target build matrix
# with its Intel-macOS cross-compile fix and per-OS license bundling,
# macos/Info.plist, and the site's download UI and CSS.
#
# See docs/INFRASTRUCTURE.md for the full constraint specification.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # Pre-releases like v0.8.0-rc.1
  # Rehearsal path. Nothing in CI parses this file, so without it every change
  # here first executes on a real version tag, where a malformed job costs that
  # tag its release. On a dispatch the build/SBOM/changelog jobs run and
  # `release` is skipped by its `if:`, so publishing stays tag-only.
  workflow_dispatch:

permissions:
  contents: write
  # `id-token: write` removed 2026-09-02: nothing here mints or consumes an
  # OIDC token, and the only signing went with the download. Re-add it with the
  # change that generates provenance — it is an elevated grant.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # BUILD CHECK — the tagged tree must compile in the profile users are told to
  # run. Replaces the deleted 4-target matrix's `beta: false` leg, which was the
  # only thing stopping a non-building tag from publishing.
  # ============================================================================
  build-check:
    name: Build Cendrillon (release, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # ⚠ DELIBERATELY NOT the retired matrix's shape. There, only arm64 macOS
    # blocked, because a red leg meant one DOWNLOAD was missing and the others
    # still shipped. The notes now tell every user on every OS to build from
    # source, so a leg that does not compile means the tag publishes
    # instructions that do not work — and nothing else compiles this crate in
    # release profile anywhere. macOS and Linux therefore block. Windows stays
    # non-blocking: its runners are the flakiest, and it is the platform the
    # maintainer verifies by hand.
    # Caps are MEASURED, not guessed: on the v0.3.2 tag all legs ran cold and
    # cacheless on this same graph — macOS 8m26s, Linux 9m24s, Windows 15m58s,
    # 22 min whole workflow — and those legs also packaged, signed and uploaded,
    # which this compile-only job does not.
    # ⚠ A cap bounds a HUNG BUILD, not a queue wait: GitHub does not count time
    # spent waiting for a runner, so the v0.1.3 hang (macos-13 retired, a leg
    # queued 24h for a runner that never came) is NOT addressed here.
    continue-on-error: ${{ matrix.beta }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            beta: false
          - os: ubuntu-latest
            beta: false
          - os: windows-latest
            beta: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # `save-if: false` — every tag is its own cache scope, so anything saved
      # here is unrestorable by any later run and would evict main's live
      # entries under the repo's LRU budget. Restore only.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-linux-deps
        with:
          # The list the retired build job used. Verified sufficient rather
          # than assumed: v0.3.2 shipped Cendrillon-linux-x86_64.tar.gz, so this
          # list did compile the crate in release on this runner. NOT the
          # from-source prerequisite list in the notes below — the runner
          # preinstalls cmake, g++ and pkg-config, so a CI list is a delta.
          packages: libfontconfig1-dev
      - run: cargo build --release --locked -p cf-studio-gui

  # ============================================================================
  # GENERATE SBOM
  # ============================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    # ⚠ The SBOM is this release's only asset now, and this job still tolerates
    # failure — so a failure publishes an empty release. Tracked in #866.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      # Current cargo-cyclonedx has no --output-file; it writes a
      # <crate>.cdx.json per package. Generate, then gather them.
      - name: Generate SBOM (CycloneDX)
        run: cargo cyclonedx --format json

      # cargo-cyclonedx writes one <crate>.cdx.json per workspace member
      # (~280 of them). Keep only Cendrillon's — attaching all of them as
      # release assets is noise AND trips GitHub's upload rate limit.
      - name: Collect Studio SBOM
        run: |
          mkdir -p sbom-out
          find . -name 'cf-studio-gui.cdx.json' -not -path './sbom-out/*' -exec cp {} sbom-out/ \;

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-out/
          if-no-files-found: warn

  # ============================================================================
  # GENERATE CHANGELOG
  # ============================================================================
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Nearest version tag that is an ANCESTOR of this one (git describe
          # walks ancestry, so a tag on a squash-merged side branch — not in
          # this commit's history — is correctly skipped). `--match 'v[0-9]*'`
          # keeps any non-version tag from being picked as the baseline.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # No ancestor tag (genuine first release, or earlier tags live on
            # squash-merged branches outside this history). Do NOT fall back to
            # `git log HEAD` — that dumps the entire repo history into the notes.
            # A short note is the honest, readable result.
            COMMITS="- Initial tagged release from this history."
          else
            # Commits since the previous ancestor tag.
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi

          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep "^- feat" || true)
          FIXES=$(echo "$COMMITS" | grep "^- fix" || true)
          DOCS=$(echo "$COMMITS" | grep "^- docs" || true)
          REFACTORS=$(echo "$COMMITS" | grep "^- refactor" || true)
          OTHER=$(echo "$COMMITS" | grep -v "^- feat\|^- fix\|^- docs\|^- refactor" || true)

          # Build changelog. Category headers are h3 (###) so they nest under
          # the release body's "## What's new" h2 instead of colliding with it.
          CHANGELOG=""

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### Features\n\n${FEATURES}\n\n"
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes\n\n${FIXES}\n\n"
          fi

          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}### Documentation\n\n${DOCS}\n\n"
          fi

          if [ -n "$REFACTORS" ]; then
            CHANGELOG="${CHANGELOG}### Refactoring\n\n${REFACTORS}\n\n"
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes\n\n${OTHER}\n\n"
          fi

          # Output for GitHub Actions
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ============================================================================
  # CREATE RELEASE
  # ============================================================================
  release:
    name: Create Release
    needs: [build-check, sbom, changelog]
    # Tag-only: a workflow_dispatch rehearsal must never publish a release named
    # after a branch ref (`version` below is `${GITHUB_REF#refs/tags/}`).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download SBOM
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: sbom
          path: ./artifacts

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: CortenForge ${{ steps.version.outputs.version }}
          body: |
            # CortenForge ${{ steps.version.outputs.version }}

            The CortenForge SDK — a Rust workspace for mechatronics design and
            simulation — and **Cendrillon**, the guided app that takes a 3D scan
            all the way to printable, silicone-cast molds.

            ## Running it

            There is no download; everything here is built from source.

            You need a Rust toolchain (see `rust-toolchain.toml`), **CMake and a
            C++ compiler** — `manifold-csg-sys` builds a vendored C++ kernel
            through CMake — and a working Vulkan or GL driver for the 3D views.
            On Debian/Ubuntu that is:

            ```
            sudo apt-get update
            sudo apt-get install cmake build-essential pkg-config \
              libwayland-dev libxkbcommon-dev libasound2-dev \
              libudev-dev libfontconfig1-dev
            ```

            Then:

            ```
            git clone https://github.com/via-balaena/CortenForge.git
            cd CortenForge
            git checkout ${{ steps.version.outputs.version }}
            cargo run --release -p cf-studio-gui   # Cendrillon
            ```

            Without the `git checkout` you build `main`, not this tag.

            Building from source also removes the unsigned-binary warnings the
            old downloads carried on macOS and Windows.

            ## What's new

            ${{ needs.changelog.outputs.changelog }}

            ---
            By using this software you accept the terms in `DISCLAIMER.md` — it is general-purpose research software, provided **as is**, **not a medical device**, used **entirely at your own risk**. The repository carries `LICENSE-APACHE`, `LICENSE-MIT`, `NOTICE`, and `DISCLAIMER.md`.

            A CycloneDX SBOM for `cf-studio-gui` is attached when one was produced — Cendrillon's own resolved dependency graph, not the whole workspace, whose ~280 per-crate SBOMs would trip GitHub's upload limit. The workspace meets the A-grade quality standard ([STANDARDS.md](https://github.com/via-balaena/CortenForge/blob/main/docs/STANDARDS.md)).
          files: |
            artifacts/*.cdx.json
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # PUBLISH TO CRATES.IO (Optional - manual trigger)
  # ============================================================================
