# CortenForge Scheduled Maintenance
#
# Runs periodic checks that are too expensive for every PR:
# - Fresh security advisory scan
# - Per-crate coverage, via the grader itself (the ONLY CI path that measures it)
# - Mutation testing (test quality verification)
# - Dependency update check
# - Benchmark regression monitoring
#
# See docs/INFRASTRUCTURE.md for the full constraint specification.

name: Scheduled Maintenance

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # SECURITY AUDIT (Fresh advisories)
  # ============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run security audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for yanked dependencies
        run: cargo audit --deny yanked

  # ============================================================================
  # COVERAGE — the only CI path that measures the per-crate Coverage criterion
  # ============================================================================
  # `quality-gate.yml` passes `--skip-coverage` on BOTH of its scoping branches,
  # so before this job existed nothing in CI measured coverage at all. The
  # per-crate criterion in `docs/STANDARDS.md` existed only as a local
  # `cargo xtask grade <crate>` command, under a workflow header reading
  # "A-grade or it doesn't ship".
  #
  # ★ It replaces a `cargo tarpaulin --workspace --fail-under 75` job that was
  # wrong in two independent ways:
  #
  #   1. WRONG INSTRUMENT. A workspace AGGREGATE, where one crate at 40 % hides
  #      inside a total that clears 75 %. `xtask grade` thresholds each crate
  #      separately, so the two could disagree — two coverage mechanisms with
  #      different semantics is drift waiting to happen.
  #   2. IT NEVER PRODUCED A NUMBER. It failed at COMPILE time under
  #      tarpaulin's instrumentation (`pulp-0.22.2` trips a const assertion),
  #      red on every scheduled run back to at least 2026-06-28 — and the
  #      `Weekly Summary` job reported that as a row in a table, which is why
  #      eight weeks of it went unnoticed.
  #
  # Running the grader itself means ONE instrument, shared with the local gate:
  # a number here is reproducible by `cargo xtask grade <crate>` on a laptop.
  #
  # ⚠ EXPECTED TO BE RED WHEN IT LANDS, and that is the point — it is a
  # measurement, not a merge gate. ★ THIS JOB'S FIRST RUN IS THE AUTHORITATIVE
  # LIST; what follows is the expectation going in, not a count to quote. From
  # the 2026-08-16 census, less the four crates #776 took over the bar:
  # cf-viewer (33.8 %), sim-bevy (35.0 %), sim-core (63.8 %), sim-mjcf (66.4 %)
  # and cf-device-geometry (69.8 %, re-measured 2026-08-17). All pre-existing.
  #
  # They are deliberately NOT waived onto `COVERAGE_REPORT_ONLY`: that list's
  # invariant is "never add a crate that was ALREADY measured and failing",
  # because doing so switches off a gate that fires today rather than deferring
  # one that just appeared. Emptying the list is the work; hiding it is not.
  #
  # ★ It needs no `--exclude`, unlike the tarpaulin job it replaces. Coverage's
  # pass 2 (`cargo test --release -p <crate>`) is what could have made this job
  # enormous, but `coverage_skip_reason` returns BEFORE pass 2 for
  # `grading_profile = "integration-only"` — and both candidates declare it:
  # `sim-conformance-tests` (the old job's named timeout source, 60k lines and
  # 500k+ sim steps) and `sim-soft`, whose release-only
  # `bonded_layer_indentation` is the single most expensive test in the
  # workspace at 24.2 min. Neither runs here, which is why neither shows up in
  # the 70.4 min sizing run, and why this job does NOT duplicate the
  # `soft-contact-heavy` job below. Verified 2026-08-17 — do not "fix" it by
  # adding excludes.
  #
  # Weekly rather than per-PR: a coverage run is minutes to tens of minutes PER
  # CRATE (measured: sim-thermostat ~16 min), which is why the PR shards skip
  # it. Sharded 3 ways to match `quality-gate.yml`'s grade job. The timeout is
  # deliberately far above the ~25-30 min/shard the local sizing run implies,
  # because nothing waits on this job and a slow runner must not turn a real
  # measurement into a timeout — the failure mode that reads as "broken CI"
  # rather than "coverage is short".
  coverage:
    name: Coverage (grade shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Scoped to THIS job rather than the workflow, so the other ten jobs keep
    # their current behaviour. It is the longest job in the repo and the
    # workflow accepts `workflow_dispatch`, so without a group an impatient
    # re-trigger runs a second three-hour sweep alongside the first — hours of
    # runners spent twice, on a pool `quality-gate.yml` already guards for the
    # same reason ("stacked runs starve the runner pool", there).
    # `cancel-in-progress: false` because a sweep 150 minutes in is nearly
    # done: queue behind it rather than throwing that away.
    concurrency:
      group: weekly-coverage-shard-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      # ⚠ The bound matters MOST here, and that is why this note stays. This job's
      # budget is 180 minutes, so the stall that cost one 45-minute shard elsewhere
      # would cost THREE HOURS PER SHARD here and still measure nothing. A setup step
      # must not be able to spend a sweep's whole budget without producing a sweep.
      # (Observed 2026-08-18: `apt-get update` printed five lines, stalled fetching
      # `archive.ubuntu.com/ubuntu noble-security InRelease`, and emitted nothing for
      # 44 minutes.) The bound itself now lives in the action, with the measurements
      # that set it — an earlier revision of this comment described a step-level
      # ⚠ The step cap is KEPT, on top of the action's per-attempt bound, and the two
      # are not redundant: the action bounds each `apt-get` invocation (so the common
      # failure fails fast, with a message naming the cause), while this caps the step
      # TOTAL. `timeout-minutes:` is available here because this step only *calls* a
      # composite action — it is unavailable on steps *inside* one, which is why the
      # action cannot express this itself.
      # ⚠ `mesa-vulkan-drivers` is NOT decoration, and this is the job that proves
      # it. `sim-gpu`'s tests take a GPU adapter or return early, and a returning
      # test reports `ok` — so the 2026-08-18 sweep scored the crate 1.2 % of its
      # production lines while every one of its 51 tests "passed". The package
      # provides lavapipe, a CPU Vulkan device wgpu accepts as an ordinary adapter;
      # the suite then runs in ~19 s and covers 97.7 %. `CF_REQUIRE_GPU` on the
      # grade step turns a missing adapter back into a failure, so this number
      # cannot quietly revert to measuring nothing.
      - name: Install system dependencies
        timeout-minutes: 10
        uses: ./.github/actions/install-linux-deps
        with:
          packages: libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libfontconfig1-dev
            mesa-vulkan-drivers

      # ⚠ `components:` here installs into whatever channel this action
      # resolves — NOT into the toolchain that actually runs. `rust-toolchain.toml`
      # pins 1.96.0 and rustup honours it over the action's channel, so
      # `llvm-tools-preview` requested here landed in `stable` and every
      # `rustc` invocation kept using 1.96.0 without it.
      #
      # ★ An earlier version of this comment claimed the line below was
      # "load-bearing" for coverage. It was inert. The first weekly run
      # (2026-08-18) reported `(llvm-tools n/a)` for all 22 coverage-graded
      # crates in shard 1 — caught only because `grade-all` fails closed on an
      # unmeasured sweep (`SweepTally::coverage_unavailable`); without that
      # guard it would have printed "101/101 workspace crates pass".
      #
      # ⇒ llvm-tools is declared in `rust-toolchain.toml` instead, where it
      # reaches the toolchain that runs. Do not "fix" a future coverage
      # regression by adding components here.
      #
      # ⚠ `clippy` and `targets:` below are inert for the same reason and are
      # NOT removed here — every other Rust job in this repo passes the same
      # pair, and stripping them from one job only would read as this job
      # needing something different. `llvm-tools-preview` is deleted rather
      # than left beside them because it was added specifically to make
      # coverage work and did not: leaving it would keep asserting a fix that
      # is not one. Removing the redundant pair everywhere is its own change.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # No `--skip-coverage`: this job exists precisely to run the criterion
      # every other CI path skips. Full workspace, never `--only` — a weekly
      # sweep scoped to a diff would measure whatever last week happened to
      # touch.
      #
      # ★ And no `--quiet`, unlike the PR grade shards it otherwise mirrors.
      # That flag suppresses the one-line-per-crate progress, which costs
      # nothing on a ~13 min job and a great deal on one that can run over an
      # hour: a silent job cannot be distinguished from a hung one, and if it
      # does hit the timeout the log would end without ever naming the crate it
      # died on — for a coverage sweep, the single most useful fact in it.
      # `run_all` forces `--quiet` per crate regardless, so this buys the
      # progress lines WITHOUT the per-criterion chatter of 60-odd crates.
      - name: cargo xtask grade-all --shard ${{ matrix.shard }}/3
        env:
          XTASK_GRADE_DEBUG: "1"
          CF_REQUIRE_GPU: "1"
        run: |
          cargo run -p xtask --release -- grade-all \
            --shard ${{ matrix.shard }}/3

  # ============================================================================
  # DEPENDENCY FRESHNESS
  # ============================================================================
  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Check outdated dependencies
        run: |
          echo "## Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following dependencies have newer versions available:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo outdated --workspace >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # MUTATION TESTING (Test Quality)
  # ============================================================================
  mutation-testing:
    name: Mutation Testing
    runs-on: ubuntu-latest
    # Mutation testing is slow, run on a subset of critical crates
    strategy:
      fail-fast: false
      matrix:
        crate:
          - mesh-types
          - mesh-repair
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run mutation testing on ${{ matrix.crate }}
        run: |
          cargo mutants --package ${{ matrix.crate }} --timeout 300 -- --release
        continue-on-error: true

      - name: Report results
        run: |
          echo "## Mutation Testing: ${{ matrix.crate }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f mutants.out/missed.txt ]; then
            MISSED=$(wc -l < mutants.out/missed.txt)
            TOTAL=$(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0)
            TOTAL=$((TOTAL + MISSED))
            SURVIVAL=$((MISSED * 100 / TOTAL))
            echo "Survival rate: ${SURVIVAL}% (${MISSED}/${TOTAL} mutants survived)" >> $GITHUB_STEP_SUMMARY
            if [ "$SURVIVAL" -gt 30 ]; then
              echo "⚠️ High survival rate indicates weak test coverage" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No mutation results found" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # BENCHMARK BASELINE
  # ============================================================================
  benchmark-baseline:
    name: Benchmark Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # This job had no system-dependency step at all, so it never reached a
      # benchmark: `yeslogic-fontconfig-sys` panicked in its build script and the
      # build failed, measured on the 2026-08-18 run. Same package, same cause as
      # the clippy-drift job below.
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          packages: libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ⚠ `cargo bench --all-features -- --save-baseline weekly` could never have
      # worked, and nobody had seen it try: this job died in `apt` for months, then in
      # the `--all-features` union, and only reached its own command on 2026-08-21.
      #
      # Bare `cargo bench` benchmarks every target whose manifest leaves `bench = true`
      # — every lib and every bin — and those run under the stock libtest harness,
      # which rejects criterion's flag before any real benchmark starts:
      #
      #   Running unittests src/lib.rs (…/cf_anthro-…)
      #   error: Unrecognized option: 'save-baseline'
      #
      # ⚠ `--benches` does NOT fix this, however much it reads like it should. Cargo
      # defines it as "benchmark all targets that have `bench = true` set", i.e. the
      # same set. Verified rather than assumed: the `-Z unstable-options --unit-graph`
      # output is byte-identical with and without it, and the failure reproduces
      # unchanged. Only `--bench <NAME>` selects an actual bench target.
      #
      # The names are derived from the manifests rather than listed here, for the same
      # reason the MSRV job derives its toolchain: a hardcoded list goes stale in
      # silence, and a newly added criterion bench would simply never be run while this
      # job kept reporting success.
      - name: Run benchmarks
        run: |
          set -euo pipefail

          # ⚠ Captured in stages, NOT as `mapfile < <(cargo metadata | jq …)`. `set -e`
          # does not fire for a pipeline inside a process substitution — verified — so
          # a broken `cargo metadata` or missing `jq` would leave the list empty and be
          # reported below as "no bench targets", blaming the manifests for a tooling
          # failure. Written this way, each tool fails this step with its own error.
          meta=$(cargo metadata --no-deps --format-version 1)
          names_raw=$(jq -r '.packages[].targets[] | select(.kind[] == "bench") | .name' <<< "$meta" | sort -u)

          # Fail closed. Zero targets would otherwise benchmark nothing and pass,
          # which is the exact shape of failure this workflow keeps producing.
          if [ -z "$names_raw" ]; then
            echo "::error::no bench targets found in any manifest - this job would have benchmarked nothing and reported success"
            exit 1
          fi

          mapfile -t names <<< "$names_raw"
          args=()
          for n in "${names[@]}"; do args+=(--bench "$n"); done
          echo "benchmarking ${#names[@]} target(s): ${names[*]}"

          cargo bench --workspace --all-features "${args[@]}" -- --save-baseline weekly

      # ⚠ `if-no-files-found` defaults to `warn`, which would upload an empty artifact
      # and let this job report success having saved no baseline — the same shape of
      # quiet nothing it produced for months. `target/criterion` is criterion's default
      # `CRITERION_HOME` relative to the workspace target dir; if that ever moves, this
      # should fail rather than shrug.
      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-baseline
          path: target/criterion
          retention-days: 90
          if-no-files-found: error

  # ============================================================================
  # SUPPLY CHAIN VERIFICATION
  # ============================================================================
  supply-chain:
    name: Supply Chain Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-vet
        run: cargo install cargo-vet

      - name: Check supply chain
        run: |
          # Initialize if needed
          cargo vet init 2>/dev/null || true
          # Check for unvetted dependencies
          cargo vet --locked || echo "::warning::Some dependencies are not vetted"

      - name: Generate supply chain report
        run: |
          echo "## Supply Chain Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo vet dump-graph 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "cargo-vet not fully initialized" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # MSRV CHECK
  # ============================================================================
  # Checks that the workspace still builds on the toolchain `[workspace.package]
  # rust-version` promises consumers. HOW that toolchain is resolved, and the three
  # defects that stopped this job ever compiling a line, live in
  # `.github/actions/msrv-toolchain/` — in a script, so they can be linted and
  # tested rather than argued. No Rust version is named anywhere in this job.
  #
  # What belongs here is the command and its SCOPE, stated rather than implied:
  # default features, `--workspace`, lib and bin targets. The promise is about
  # CONSUMING these crates, so dev-dependencies are out of scope, and default
  # features are what a consumer gets by naming the crate.
  #
  # `--all-features` is deliberately NOT used, and that is now a CHOICE rather than
  # a blocker. It was a blocker when this job was written: the union did not build
  # at all until `sim-bevy`'s unused `trace` feature was disabled — see that
  # crate's manifest for the `profiling` lib/macro feature split it tripped. What
  # remains is scope (an optional feature's MSRV is a promise nobody made) and cost
  # (it drags every optional dependency in the graph into a job whose question is
  # whether the DECLARED toolchain still builds what we ship). The union itself is
  # checked weekly by the Clippy drift job below, which does pass `--all-features`.
  #
  # Deliberately uncached: the weekly cadence makes the rebuild cost irrelevant, and
  # a cache keyed on a different toolchain than the one under test is one more way
  # for a job to measure something other than what it says.
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          packages: libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libfontconfig1-dev

      # No toolchain action here: rustup ships preinstalled on GitHub-hosted runners,
      # and the MSRV is the only toolchain this job installs — so there is no second
      # channel present for a bare `cargo` to fall back to unnoticed.
      - name: Resolve and install the declared MSRV
        id: msrv
        uses: ./.github/actions/msrv-toolchain

      # ⚠ Naming the toolchain on the command line is load-bearing, not decoration:
      # installing it is not enough, because `rust-toolchain.toml` beats whatever
      # channel is merely made default. The version reaches the shell as data rather
      # than by `${{ }}` interpolation into script text, and printing it first means
      # the log records which cargo actually ran the check.
      - name: Check the workspace builds on the MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.msrv }}
        run: |
          set -euo pipefail
          cargo "+$MSRV" --version
          cargo "+$MSRV" check --workspace --locked

  # ============================================================================
  # CLIPPY TOOLCHAIN-DRIFT EARLY WARNING
  # ============================================================================
  # Rust ships a new stable every ~6 weeks, and each one can promote/sharpen
  # clippy lints (the workspace opts into `pedantic` + `nursery`). PR CI rides
  # `@stable`, but local dev toolchains lag — so a contributor's local clippy can
  # pass while the next CI run fails on a lint their toolchain never had. That gap
  # masked a real failure once (the 1.95 -> 1.96 `suboptimal_flops` sweep). This
  # weekly job runs clippy on the *current* stable and prints its version, so new
  # lints surface as a standing signal pointing at the drift — before they block a
  # PR merge. It mirrors the PR clippy gate exactly (`--all-targets --all-features
  # -- -D warnings`).
  clippy-stable-drift:
    name: Clippy (latest stable drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # `libfontconfig1-dev` is not decoration: without it `yeslogic-fontconfig-sys`
      # (slint -> the studio crates) panics in its build script, and this job died
      # there — before running a single lint — on every weekly run through
      # 2026-08-18. Its red was read as toolchain drift; it was a missing package.
      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          packages: libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libfontconfig1-dev

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Record toolchain version
        run: |
          echo "## Clippy Drift Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ran against the latest stable toolchain:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          rustc --version >> $GITHUB_STEP_SUMMARY
          cargo clippy --version >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Run clippy on latest stable
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ============================================================================
  # SUMMARY
  # ============================================================================
  summary:
    name: Weekly Summary
    needs: [security-audit, coverage, dependencies, mutation-testing, benchmark-baseline, supply-chain, msrv, clippy-stable-drift, soft-contact-heavy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Weekly Maintenance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.coverage.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mutation Testing | ${{ needs.mutation-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmarks | ${{ needs.benchmark-baseline.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supply Chain | ${{ needs.supply-chain.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MSRV | ${{ needs.msrv.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Soft contact heavy (#676) | ${{ needs.soft-contact-heavy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Clippy Drift | ${{ needs.clippy-stable-drift.result }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # SOFT CONTACT (HEAVY) - the weekly backstop for the demand-#1 gate, #676
  # ============================================================================
  # `bonded_layer_indentation` gates demand #1 of the Tet10 arc — the
  # mesh-converged ~9 % Tet4 curved-contact-patch over-stiffness (extrapolated
  # floor 1.0915). The Quality Gate runs it per-PR, but deliberately behind a
  # `sim/L0/soft/**` PATH filter rather than the affected set, because sim-soft
  # depends on cf-geometry / mesh-offset / mesh-types / sim-ml-chassis and the
  # reverse-dep closure would fire an hour-long job on unrelated foundational
  # edits.
  #
  # This weekly run is the case that filter misses BY CONSTRUCTION: a change in
  # one of those dependencies that genuinely breaks the contact force law
  # without touching sim/L0/soft/**. Weekly is the right cadence — the gate had
  # run in ZERO CI jobs since it landed, so catching such a regression within a
  # week is the improvement; catching it within a merge is not worth ~1 h of
  # runner time on every merge.
  soft-contact-heavy:
    name: Soft contact heavy (#676)
    runs-on: ubuntu-latest
    # Measured 24.2 min locally against a 1.0-2.2x CI factor; sized so a slow
    # runner cannot turn a passing gate into a timeout failure.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          packages: libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run the demand-#1 bonded-layer indentation gate
        run: cargo test --release -p sim-soft --test bonded_layer_indentation
