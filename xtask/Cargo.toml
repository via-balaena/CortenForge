[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Development automation and quality enforcement for CortenForge"
# Inherited, so the license can never drift from the workspace. The `version` and
# `edition` above are deliberately NOT inherited — those divergences are intended.
# The license was not: it was a hand-copied duplicate, and it went stale.
license.workspace = true
publish = false

# This is a dev-only tool, not published to crates.io
# See: https://github.com/matklad/cargo-xtask

[dependencies]
# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Colored terminal output
owo-colors = "4"

# Error handling
anyhow = "1"

# Process execution
xshell = "0.2"

# Regex for safety checks
regex = "1"

# TOML parsing for Cargo.toml analysis
toml = "1.1"

# Serde for config parsing
serde = { version = "1", features = ["derive"] }

# JSON parsing for cargo metadata output
serde_json = "1"

# Rust source parsing: the Coverage criterion measures PRODUCTION lines, so it
# has to know which line ranges exist only under `#[cfg(test)]`. Those appear on
# modules, free functions, methods and struct fields alike, so a text scan is
# not enough -- see coverage.rs.
syn = { version = "2", features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# SHA-256 for the licensed-asset integrity check. The BodyParts3D meshes are
# pinned by digest in design/cf-fsu-geometry/BODYPARTS3D.md, but nothing verified
# them -- `licensed-gates --run` now does, before it executes a single gate. A
# pure-Rust digest beats shelling out to shasum/sha256sum, which differ by
# platform; sha2 is already in the workspace lock, so this adds a direct edge
# rather than new supply-chain surface.
sha2 = "0.10"

# Walking directories
walkdir = "2"

# Date/time for completion records
chrono = "0.4"

# Finding executables in PATH
which = "8"
