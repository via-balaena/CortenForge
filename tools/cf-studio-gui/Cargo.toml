[package]
name = "cf-studio-gui"
description = "CortenForge Studio — the polished, accessible Bevy + egui GUI frontend for the guided scan→cast workflow. A thin client over cf-studio-engine + the cf-studio-core Project state machine (the same boundary the cf-studio CLI uses). See MISSION.md."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

# Cendrillon app stack — App tier (the dependency sink): may depend on the SDK,
# but no SDK crate may depend on it (enforced by grade Layer Integrity).
# See MISSION.md. The Project→display mapping lives in the lib (testable,
# headless); the binary is Bevy wiring, which needs a display to *run* but
# compiles headlessly.
[package.metadata.cortenforge]
tier = "App"

[[bin]]
name = "cf-studio-gui"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# `forbid`, matching every other Bevy tool. Slint's generated code carried its
# own `#[allow(unsafe_code)]` for VTable statics, which `forbid` cannot permit
# and which is why this crate alone used `deny`; nothing generated remains.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
# The Project state machine + Step (the spine).
cf-studio-core = { workspace = true }
# The step executors.
cf-studio-engine = { workspace = true }

# Bevy 0.18 — the workspace's validated rendering subset. No `bevy_picking` /
# `mesh_picking`: those exist for cf-mesh-paint's brush ray-cast and Cendrillon
# does not paint.
bevy = { workspace = true, default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "bevy_winit",
    "multi_threaded",
    "tonemapping_luts",
    "zstd_rust",
] }

# egui-on-Bevy plugin — the whole wizard UI. 0.39.1 is the workspace-validated
# pin (cf-viewer / cf-sim-research / cf-spine-studio precedent).
#
# ⚠ `default-features = false` is load-bearing for licensing, not just weight:
# bevy_egui's clipboard feature pulls `clipboard-win` + `error-code`, which are
# BSL-1.0. deny.toml's allow-list no longer carries BSL-1.0 (it was there for
# Slint's copypasta) — enabling clipboard here puts it back.
bevy_egui = { version = "0.39.1", default-features = false, features = [
    "default_fonts",
    "render",
    "bevy_ui",
] }

# Shared Bevy helpers — `OrbitCameraPlugin` (orbit/pan/zoom) for the 3D view.
# UI-free by design, so it composes with this crate's own egui panels.
cf-bevy-common = { workspace = true }

# Native file dialogs for the step screens.
#
# ⚠⚠ Call these ONLY through `dialogs.rs`. A blocking `rfd::FileDialog` invoked
# from a Bevy system DEADLOCKS on macOS: the system runs on a task-pool worker,
# rfd's `run_on_main` dispatch_syncs to the main thread, and the main thread is
# already parked inside the executor scope waiting for that same system. Both
# halves were sampled; `dialogs.rs` carries the async form that fixes it.
rfd = "0.15"

[features]
default = ["x11"]
# Linux window backends — mirror cf-spine-studio's feature shape.
x11 = ["bevy/x11"]
wayland = ["bevy/wayland"]
