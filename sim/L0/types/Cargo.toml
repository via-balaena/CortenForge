[package]
name = "cortenforge-sim-types"
description = "Foundation types for sim-core: body identity and pose"
keywords = ["physics", "simulation", "robotics", "pose", "types"]
categories = ["simulation", "science", "data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.cortenforge]
tier = "L0"

[lib]
name = "sim_types"

[dependencies]
# Vector / matrix / isometry primitives for Pose, Transform, etc.
nalgebra = { workspace = true }
# Optional Serialize / Deserialize for persisted Model / Data snapshots
serde = { workspace = true, optional = true }

[dev-dependencies]
# Float-tolerance assertions for Pose / Transform unit tests
approx = { workspace = true }

[features]
default = []
serde = ["dep:serde", "nalgebra/serde-serialize"]

[lints]
workspace = true
