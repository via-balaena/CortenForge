# sim-soft-explicit — Layer-0 explicit soft-body solver, minus the GPU.
# Full story in src/lib.rs.

[package]
name = "sim-soft-explicit"
description = "Explicit hyperelastic soft-body solver core: the shared CPU/GPU physics, written once, and the lowered model layout"
keywords = ["fem", "explicit", "hyperelastic", "soft-body", "simulation"]
categories = ["simulation", "science", "mathematics"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.cortenforge]
tier = "L0"
# `tube_release` holds release-only runs (plan §16i): K2 on the 10k tube, 14k
# steps, and a converged power iteration. They belong to the tests-release
# job, which names this crate. The weekly coverage job builds every test
# binary in release and runs it instrumented (`xtask/src/coverage_run.rs:609`),
# at 164–1 226x the uninstrumented time on the suites that file measured, so
# this binary is kept out of it. `tube_sanity` drives the same `TubeRun` path
# in every coverage pass.
coverage_skip_binaries = ["tube_release"]

[dependencies]
# Derive macro for the model's error type.
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The CPU executor's per-element and per-node phases (plan §16e). Native only:
# wasm32 has no threads, and every L0 crate must build for it, so wasm32 runs
# the same phases in order.
rayon = { workspace = true }

[dev-dependencies]
# Regenerates the shared math's WGSL in the freshness test.
sim-wgsl-gen = { workspace = true }
# The CPU SDF lookup the shared one must agree with (conformance test).
cf-geometry = { workspace = true }
# Point types for building the reference SDF grid.
nalgebra = { workspace = true }

[lints]
workspace = true
