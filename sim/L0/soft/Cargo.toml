[package]
name = "sim-soft"
description = "Soft-body walking skeleton — seven-trait surface over faer + chassis tape. Phase B fills in bodies."
keywords = ["physics", "simulation", "soft-body", "fem", "differentiable"]
categories = ["simulation", "science", "mathematics"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# Grader F.3 opt-in: the six load-bearing invariants (I-1..I-6) are all
# tested in `tests/*.rs` per scope §6 test-harness commitment — the only
# inline `#[cfg(test)] mod tests` covers two `autograd_ops` VJP helpers
# (`IndexOp`, `DivOp`) which aren't on the invariant surface. `cargo llvm-cov
# --lib` coverage is structurally pinned at ~12% because the unimplemented
# Phase-B/C/E stubs are unreachable until their phases land. Coverage
# re-enters when Phase B fills in non-stub bodies. Matches sim-therm-env /
# sim-tests precedent. Full reasoning in scope §7 item 1 + §13 SD-5.
[package.metadata.cortenforge]
tier = "L0"
# Raised from L0's default 100 (release) / 120 (test). This is a deliberate,
# recorded trade, not a drift allowance.
#
# The crate sat at EXACTLY 100/100 after `feral-metis`. Enabling faer's
# `rayon` feature adds 10 crates -- rayon, rayon-core, six crossbeam, and
# `spindle` -> `atomic-wait` (the pair that costs wasm32, see the per-target
# block below) -- putting it at 110. `either` is NOT among them; it was
# already in the tree. Both spends are load-bearing and measured on the
# `bonded_layer_indentation` gate, uncontended:
#
#                    sequential    rayon
#     AMD               638.7 s   360.3 s
#     nested diss.      369.2 s   288.4 s
#
# Either lever alone is worth ~1.75x; together 2.22x. Only dropping RAYON
# actually reaches 100 -- `feral-metis` costs 3 crates, so dropping the
# ordering instead leaves 107, still over -- and that costs 80.8 s per run of
# a single gate, on a suite
# whose slowness has twice let licensed gates rot undetected
# (design/cf-fsu-geometry/BODYPARTS3D.md) — a detection failure, not a
# convenience one.
#
# The override moves the COUNT ONLY. L0's banned-crate list still applies in
# full, which is why this is declared here rather than by re-tiering the
# crate to L0-io: that tier permits 200 deps but also unbans wgpu, image,
# zip, zstd, mesh-io, sim-mjcf, sim-urdf, criterion and plotters, none of
# which belong in a pure-compute solver. 200 leaves real headroom rather
# than pinning to today's 110; `xtask grade` reports the override on every
# run, including passes, so the slack cannot be spent invisibly.
dependency_budget = 200
tier_up_features = { gpu-probe = "L0-io" }
grading_profile = "integration-only"

[features]
default = []
# I-6b probe: opt-in wgpu build-graph tractability + buffer round-trip test.
# NOT a Phase-E GPU feature flag — real chassis-GPU work (B.5) will land
# under a separate `gpu` feature. Locked to the round-trip test in
# `tests/invariant_6_gpu_probe.rs`. See scope §1 I-6 clarification.
gpu-probe = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
# Per-phase wall-clock timers in the solver hot path (`src/profile.rs`), for
# re-measuring recon §2d's phase-share table. OFF by default and zero-cost when
# off: the no-op `Timer` has no `Drop` and an `#[inline(always)]` constructor, so
# the default build carries no timing code — which matters because these sit
# inside the Newton loop and a solver that is measurably different when
# instrumented cannot measure itself.
phase-timing = []

[dependencies]
# Chassis tape, VjpOp, Tensor<f64> — shipped in PR #213.
sim-ml-chassis = { workspace = true }
# Sdf trait — sim-soft's `sdf_bridge::Sdf` re-exports `cf_geometry::Sdf`
# so cf-design's design surface (`Solid`), mesh-sdf's adapter impls
# (`Signed<D, S>`, `CachedGridSdf`), and sim-soft's simulation surface
# (penalty contact, BCC stuffing, MaterialField) all speak the same
# trait without an adapter. Trait method receivers are `Point3<f64>`;
# sim-soft call sites adapt at the boundary via `Point3::from(vec3)`.
# See inventory Q5 for the architecture decision. The trait moved from
# cf-design to cf-geometry (sim-soft's L0 geometric kernel) so a
# foundational solver crate no longer depends on the design-side kernel
# that uses it — closing the L0 100-dep tier cap violation surfaced in
# PR #249.
cf-geometry = { workspace = true }
# `AttributedMesh` + `IndexedMesh` for the `viz` module's FEM-grade
# visualization helpers (`boundary_surface`, `slab_cut`). First
# sim-soft consumer; before F1.1 viz lift the AttributedMesh emit
# lived in example crates only. Re-exports `cf_geometry::IndexedMesh`,
# so one dep covers both types the viz API surfaces.
mesh-types = { workspace = true }
# `ScalarGrid` + `marching_cubes` + `MarchingCubesConfig` for the
# F2.1 `design_surface` and F2.3b `design_scene` viz helpers.
# mesh-offset's marching_cubes extracts the iso-0 surface of a design
# SDF as a triangulated 3D mesh; sim-soft wraps it with barycentric
# scalar interp from the analysis tet mesh (`design_surface`) and
# uses it geometry-only for contact-primitive overlay
# (`design_scene`). Same L0 tier as sim-soft.
mesh-offset = { workspace = true }
# Dense small matrices for per-Gauss-point Material + per-element Tet4 locals
# (5 existing L0 consumers at 0.34.2 — not greenfield).
nalgebra = { workspace = true }
# Sparse SPD factor-on-tape (Llt<I, f64>) + sparse CSR assembly.
# Greenfield — this is the first workspace crate to depend on faer.
#
# `rayon` is ON. It was previously off, on a Round-6 rationale that both
# halves of measurement have since contradicted:
#
#   1. "violates determinism-in-θ" — it does not. The locked A.4 §4
#      decision is "algorithm-output, not bit-exact", and names this case
#      explicitly: "Parallel paths (rayon) accept float non-associativity."
#      Sequential bit-reproducibility is called out there as a side-effect,
#      "not a project guarantee". Measured on top of that: the factorization
#      IS bit-reproducible run-to-run under Rayon(12), and the full suite
#      passes unchanged (591 tests, zero golden churn) — parallel and
#      sequential differ from each other, but each is internally stable.
#   2. "for skeleton's 9-DOF system, rayon would provide no speedup anyway"
#      — true when written, stale by four orders of magnitude. The crate now
#      solves 70k free DOF, and sparse Cholesky is the majority of a solve.
#
# Measured on the `bonded_layer_indentation` gate, uncontended: 638.7 s
# sequential-AMD → 360.3 s with rayon alone → 288.4 s with rayon plus the
# nested-dissection ordering. Rayon is the larger of the two levers.
#
# `std` + `sparse-linalg` expose Llt<I, f64> + solve_in_place_with_conj.
# All features remain pure Rust.
# ⚠ `rayon` is declared per-target, NOT here. faer's `rayon` feature pulls
# `spindle` -> `atomic-wait`, which does not build for wasm32-unknown-unknown,
# and every L0 crate must. See the two [target.'cfg(...)'] blocks below.
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg"] }

# GPU probe deps — feature-gated via `gpu-probe`. Skeleton default build
# resolves with zero wgpu / bytemuck / pollster in the graph (scope §1 I-6a).
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
# Nested-dissection fill-reducing ordering for the sparse Cholesky symbolic
# factorization. faer ships AMD and COLAMD only, and minimum-degree loses badly
# on 3D meshes: measured on this crate's own Tet10 free-DOF tangent patterns,
# AMD's fill per row runs 435 -> 714 -> 974 across a 4.25x DOF increase while
# nested dissection holds 334 -> 458 -> 648, a 1.61x -> 2.12x numeric
# factorization speedup still widening at 27k DOF. (These supersede the
# offline-harness figures 322 / 1.65x / 2.14x this comment first carried;
# the in-situ sweep in `ordering.rs` is the authority.) Factorization is ~78% of a
# solve (profiled), so this is the largest single lever in the crate.
#
# Pure Rust — no C toolchain, no build script — and measured at parity with C
# METIS on our own patterns: fill within +-4.4%, numeric time within noise, and
# a symbolic phase CHEAPER than AMD's. Chosen over `metis-sys` to keep the L0
# solver free of a C dependency. +3 transitive crates, landing the tier at
# exactly 100/100.
feral-metis = "0.2.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native builds add faer's `rayon` feature on top of the base declaration
# above: the sparse Cholesky is the majority of a solve. In the configuration
# this crate SHIPS -- nested dissection already on -- rayon is worth 1.28x
# (`bonded_layer_indentation`, uncontended: 369.2 s -> 288.4 s). Against
# sequential AMD it measures 1.77x (638.7 s -> 360.3 s), but that is not a
# configuration we ship and is the wrong number to justify this line with.
#
# wasm32 deliberately does NOT get it. faer's `rayon` feature pulls `spindle`
# -> `atomic-wait`, which fails to compile for wasm32-unknown-unknown, and
# `xtask grade`'s WASM Compat criterion holds every L0 crate to that target.
# wasm therefore runs the same solver single-threaded — correct, just slower,
# which is the right trade for a target that has no threads to give.
faer = { version = "0.24", default-features = false, features = ["std", "sparse-linalg", "rayon"] }

# The step-boundary validity sweep (`check_validity_at_step_start`) is a per-tet
# loop over the whole mesh, run twice per step, with no cross-element coupling.
# Measured at 9.3 % of a REDUCED frame it is what caps R3's Amdahl ceiling
# (recon 2i), and under hyper-reduction it is the only remaining O(n_tets) term
# while everything else drops to O(sampled) -- so it is the line that decides
# whether R3 clears its own gate.
#
# No new bound was needed: `Mesh`, `Material`, `Element` and `ContactModel` are
# already `Send + Sync` supertraits.
#
# Native-only for the same reason faer's `rayon` feature is: wasm32 has no
# threads, and `xtask grade`'s WASM Compat criterion holds every L0 crate to
# that target. wasm runs `sweep_validity_sequential` -- same verdict, one core.
# Already in the native graph via faer's `rayon` feature, so the direct
# declaration costs the tier's 100/100 dependency budget nothing.
rayon = { workspace = true }

[dev-dependencies]
# 5-digit gradcheck tolerance assertions (Phase-B tests).
approx = { workspace = true }
# Parse the vendored Marechal-2021 measured-tensile reference asset
# (`tests/assets/marechal_2021/`) for the M1 uniaxial fidelity gate.
serde_json = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# wasm_js backend opt-in for getrandom (transitively pulled via
# rand_chacha → rand_core through sim-ml-chassis). Paired with the
# workspace `.cargo/config.toml` rustflag; native builds are unaffected
# by the target-conditional block.
getrandom = { workspace = true }

[lints]
workspace = true
