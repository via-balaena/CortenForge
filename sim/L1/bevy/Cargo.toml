[package]
name = "sim-bevy"
description = "Bevy visualization for CortenForge physics simulation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["physics", "simulation", "visualization", "bevy", "robotics"]
categories = ["simulation", "visualization", "game-development"]

[package.metadata.cortenforge]
tier = "L1"

[dependencies]
# Shared geometry kernel — SDF primitives and AABBs for debug rendering
cf-geometry = { path = "../../../design/cf-geometry" }
# Per-vertex attribute container — renderer consumes AttributedMesh
mesh-types = { path = "../../../mesh/mesh-types" }
# Shared Bevy helpers — `OrbitCamera` + `OrbitCameraPlugin` re-exported by
# `sim_bevy::camera` and `sim_bevy::prelude`. Single source of truth for
# the orbit-camera controller across cf-viewer + sim-bevy + sim-bevy-soft.
cf-bevy-common = { workspace = true }

# BodyId / Pose primitives threaded from Layer 0 into Bevy ECS components
sim-types = { path = "../../L0/types" }
# Physics Model / Data stepped by the Bevy app's simulation system
sim-core = { path = "../../L0/core" }
# MJCF scene loader that seeds the Bevy scene tree
sim-mjcf = { path = "../../L0/mjcf" }
# URDF scene loader reused alongside sim-mjcf for robot description files
sim-urdf = { path = "../../L0/urdf" }

# Matrix / vector / rotation primitives converted into Bevy Transform
nalgebra = { workspace = true }

# Bevy 0.18 engine — rendering, ECS, input, windowing. Window backend
# features (x11, wayland) are optional — enable via this crate's features
# so CI can build without system library dependencies.
bevy = { workspace = true, default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "bevy_winit",
    "multi_threaded",
    "tonemapping_luts",
    "zstd_rust",
] }

# Note: For faster local iteration, run with:
#   cargo run --features bevy/dynamic_linking
# Do NOT add dynamic_linking to dev-dependencies - it causes Windows linker failures in CI

[features]
default = []
# Linux window backends - enable for desktop usage
x11 = ["bevy/x11"]
wayland = ["bevy/wayland"]
# Ray-traced rendering (requires RTX GPU, Bevy 0.18+)
# solari = ["bevy/bevy_solari"]
# GPU profiling. DISABLED — it does not build, and it took the whole workspace's
# `--all-features` down with it.
#
# `bevy/trace` turns on `profiling`'s tracing backend. `profiling-procmacros`
# resolves to ONE unit for the whole graph, so it gets compiled with
# `profile-with-tracing` for everybody — while `profiling` (the lib) resolves to
# TWO units, and the one `rav1e` links has that feature OFF. Measured with
# `cargo +nightly -Z unstable-options --unit-graph`:
#
#   profiling@1.0.17             [default, procmacros, profiling-procmacros]
#   profiling@1.0.17             [default, procmacros, profile-with-tracing, tracing]
#   profiling-procmacros@1.0.17  [profile-with-tracing]          <- single, shared
#
# `#[profiling::function]` inside rav1e then expands to `profiling::tracing::…`
# against the instance lacking that re-export: 62 x E0433. rav1e is reachable via
# `bevy_image -> image -> ravif` in the DEFAULT graph, so nothing here avoids it.
#
# Nothing in the workspace ever enabled this feature — but `--all-features` did,
# which is how it broke `Clippy drift` and `Benchmark Baseline` every week, and the
# pre-commit hook (which clippies changed crates in one `--all-features` call).
#
# ⚠ Re-enabling needs the lib/macro split resolved upstream — not just this line
# uncommented, and NOT the workaround that suggests itself. Declaring
# `profiling = { version = "1.0", features = ["profile-with-tracing"] }` as a direct
# dependency here, to force the lib feature on target-side, was TRIED and MEASURED:
# still 62 x E0433, identical rav1e failure. The forced feature unifies with bevy's
# instance, not with the one rav1e links, so it changes nothing that matters.
#
# Dropping the feature also prunes `tracing-error` and `bevy_anti_alias` from the
# lock, both reached only via `bevy_internal/trace`; nothing here uses anti-aliasing
# (checked `Msaa`, `Fxaa`, `Smaa`, `TemporalAntiAlias` — no references).
# trace = ["bevy/trace"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
