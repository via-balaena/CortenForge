[package]
name = "example-trike-mass-budget"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Headless VALIDATOR — asserts its oracles, so `xtask run-validators` RUNS it
# in CI rather than merely type-checking it. The zero-argument path is the
# asserted one.
[package.metadata.cortenforge]
example_kind = "validator"

[dependencies]
# `Mechanism`/`Part`/`JointDef`/`Material` — the assembly primitive under test,
# and `mechanism::mass::mass_properties`, the grid integrator being composed.
cf-design = { workspace = true }
# `TrikeSpec` + the load analysis the derived budget is fed into. cf-vehicle
# does NOT depend on cf-design; this crate is the composition point.
# The vehicle-agnostic assembly checks. ⚠ It knows nothing about trikes: the
# interpenetration scan below works on a gripper or a boat unchanged.
cf-assembly-checks = { workspace = true }
cf-vehicle = { workspace = true }
# The vehicle itself. This crate composes a budget from it; it knows nothing
# about loads, and cf-vehicle knows nothing about geometry.
cf-trike = { workspace = true }
# `Model` — the physics model the simulation gate builds and inspects.
sim-core = { workspace = true }
nalgebra = { workspace = true }
# `save_stl` — the optional `--out <dir>` export. The zero-argument path, which
# is the one `run-validators` runs, writes nothing.
mesh-io = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
